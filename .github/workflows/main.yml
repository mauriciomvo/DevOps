name: Deploy GCP Bucket
on: [push]

permissions:
  contents: read
  id-token: write # CRUCIAL: Sem isso, o 'auth' falhará

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/479938390797/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-storage@hosting-br.iam.gserviceaccount.com'

      - uses: 'google-github-actions/setup-gcloud@v2'
      
      - name: Terraform
        run: |
          terraform init
          terraform apply -auto-approve
